short_bio: >-
  <p>
    The question that drives me in photonics is not simply whether light can perform an operation, but whether its advantage survives once the whole system is built.
  </p>
  <p>
    My work has moved from femtosecond-laser-written devices and structured vectorial fields, through skyrmions in guided media, to fabrication-aware integrated photonics at A*STAR IME. Across these projects, I have learned that fabrication, calibration, conversion, measurement, and control are not implementation details; they decide which optical ideas can become useful hardware.
  </p>
  <p>
    I want to work across device physics and computing architecture, moving in both directions: from system bottlenecks to the devices and interfaces they demand, and from emerging optical physics to the architectures it might enable. My goal is to understand when speed and parallelism remain meaningful after data movement, precision, packaging, and electronics enter the picture, then turn that understanding into scalable photonic systems.
  </p>

